name: Lumi verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Lumi verify
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - run: python -m pip install -r requirements.txt
      - name: Run synthetic MLX smoke on CPU
        run: python -c 'import mlx.core as mx,runpy; mx.set_default_device(mx.cpu); runpy.run_path("tests/smoke_test.py",run_name="__main__")'
      - name: Run v1.1 synthetic unit tests on CPU
        run: python -c 'import mlx.core as mx,unittest; mx.set_default_device(mx.cpu); r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover("tests",pattern="v1_1_test.py")); raise SystemExit(not r.wasSuccessful())'
      - run: node --test .github/scripts/ai-review.test.cjs
